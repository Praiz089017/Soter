# Core field flow: capture evidence and upload it while online.
#
# The emulator cannot drive the native camera/gallery picker, so the E2E
# build exposes a "simulate capture" control (EvidenceUploadScreen, gated
# by EXPO_PUBLIC_E2E=1) that feeds a bundled image through the real
# compression/upload pipeline. With connectivity available the upload is
# expected to complete inline rather than be queued.
appId: org.pulsefy.soter.mobile
name: evidence-capture-queue
tags:
  - e2e
  - evidence
---
- launchApp:
    clearState: true

# Open evidence capture directly (the aid details screen sits behind a
# biometric gate, which would otherwise make the flow depend on device
# biometric enrolment).
- openLink: "soter://aid/E2E-AID-1/evidence"

- extendedWaitUntil:
    visible:
      id: "e2e-simulate-capture"
    timeout: 30000

# Populate the capture pipeline, then upload.
- tapOn:
    id: "e2e-simulate-capture"
- assertVisible:
    id: "upload-evidence-button"
- tapOn:
    id: "upload-evidence-button"
    enabled: true

# Online: the upload completes against the E2E backend without queueing.
- extendedWaitUntil:
    visible: "Evidence uploaded successfully."
    timeout: 45000
