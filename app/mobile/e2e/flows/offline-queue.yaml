# Core field flow: capture evidence while offline and confirm it is queued.
#
# The harness puts the device in airplane mode before launching this flow.
# NetInfo reports offline, so the evidence upload must be persisted to the
# sync queue (AsyncStorage) instead of being attempted, and must be visible
# in the submission queue for inspection.
appId: org.pulsefy.soter.mobile
name: offline-queue
tags:
  - e2e
  - offline
---
- launchApp:
    clearState: true

- openLink: "soter://aid/E2E-AID-1/evidence"

- extendedWaitUntil:
    visible:
      id: "e2e-simulate-capture"
    timeout: 30000

# The screen tells the worker uploads will be queued.
- assertVisible: "Offline mode: evidence upload will queue and resend when the device reconnects."

- tapOn:
    id: "e2e-simulate-capture"
- tapOn:
    id: "upload-evidence-button"
    enabled: true

# The upload is queued, not attempted.
- extendedWaitUntil:
    visible: "Upload queued and will send when connectivity returns."
    timeout: 30000

# It survives navigation and is inspectable in the submission queue.
- openLink: "soter://queue"
- extendedWaitUntil:
    visible: "Submission Queue"
    timeout: 30000
- assertVisible: ".*Offline.*"
- assertVisible: ".*1 pending.*"
- assertVisible: "Evidence Upload"
